services:
  silexa-comp:
    build:
      context: .
      dockerfile: Dockerfile
    image: silexa-app:latest
    container_name: silexa-compose

    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TEMPORAL_HOST: temporal-client:7233
    depends_on:
      temporal-client:
        condition: service_started
    restart: unless-stopped
  temporal-worker:
    image: silexa-app:latest
    container_name: temporal-worker
    env_file:
      - .env
    environment:
      TEMPORAL_HOST: temporal-client:7233
    command: python -m app.schedulers.temporal.worker
    depends_on:
      temporal-client:
        condition: service_started
    restart: unless-stopped

  temporal-postgres:
    image: postgres:16
    container_name: temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: 123Saxena
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  temporal-client:
    image: temporalio/auto-setup:latest
    container_name: temporal-client
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: 123Saxena
      POSTGRES_SEEDS: temporal-postgres
    depends_on:
      temporal-postgres:
        condition: service_started
    restart: unless-stopped

  temporal-ui-c:
    image: temporalio/ui:latest
    container_name: temporal-ui-c
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal-client:7233
    depends_on:
      temporal-client:
        condition: service_started
    restart: unless-stopped

volumes:
  temporal-postgres-data: